<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div style="display: flex;">
        <div class="sidebar">
            <div>
                <h2>InventoAI</h2>
            </div>
            <div>
                <h3>Dashboard</h3>
                <h3>Products</h3>
                <h3>Customers</h3>
            </div>
        </div>

        <div class="contentArea">
            <header>
                <div>
                    <h1>Dashboard</h1>
                    <p>Here You Can Manage all your Products</p>
                </div>
                <div class="account">
                    <button class="acc-btn">Neel</button>
                </div>
            </header>

            <div class="sectionArea">
                <section>
                    <div>
                        <h4>Search</h4>
                    </div>
                    <select>
                        <option>Select Product</option>
                        <option>Food</option>
                        <option>Arms</option>
                        <option>Fuel</option>
                    </select>
                </section>

                <div class="tableArea">
                    <table>
                        <tr style="color: white; background-color: #1E293B;">
                            <th>Image</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Segment</th>
                            <th>Price</th>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>Food</td>
                            <td>Survival</td>
                            <td>Resources</td>
                            <td>450$</td>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>Arms</td>
                            <td>Defense</td>
                            <td>Resources</td>
                            <td>950$</td>
                        </tr>
                        <tr>
                            <td>1</td>
                            <td>Fuel</td>
                            <td>Travel</td>
                            <td>Resources</td>
                            <td>250$</td>
                        </tr>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
