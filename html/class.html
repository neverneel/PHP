<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class</title>
    <style>
        .city {
            background-color: aqua;
            color: crimson;
            border: 2px solid black;
            padding: 5%;
            margin: 5%;
        }

        .district {
            background-color: darkgrey;
            color: black;
            border: 2px solid black;
        }

        tr:nth-child(even){
            background-color: burlywood;
        }
    </style>
</head>
<body>
    <div class="city">
        <h2>London</h2>
        <p>London is the capital of England</p>
    </div>

    <div class="district">
        <h2>Tarn Taran</h2>
        <p>Tarn Taran is a district of Punjab</p>
    </div>

    <div class="city">
        <h2>Delhi</h2>
        <p>Delhi is the capital of India</p>
    </div>

    <div>
        <table style="margin: auto;">
            <tr>
                <th>Vehicle</th>
                <th>Vehicle</th>
                <th>Vehicle</th>
            </tr>

            <tr>
                <td>car</td>
                <td>car</td>
                <td>car</td>
            </tr>


            <tr>
                <td>bus</td>
                <td>bus</td>
                <td>bus</td>
            </tr>
        </table>
    </div>
</body>
</html>
