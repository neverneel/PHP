<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
    }
    .login-btn {
        background-color: greenyellow;
        border-radius: 20px;
        padding: 10px 25px;
    }

    .reset-btn {
        background-color: red;
        border-radius: 20px;
        padding: 10px 25px;
    }

    input {
        width: 400px;
        height: 30px;
        border-radius: 5px;
    }
    </style>
</head>
<body>
    <h1 style="text-align: center;">Login</h1>

    <div style="border: 2px solid black; width: 600px; height: 300px; margin: auto; background-image: url(Darth.jpg); border-radius: 10px;">
        <form action="raphinha.gif" style="text-align: center; margin-top: 50px;">
            <!-- <label for="name" style="font-size: larger; background-color: white;">Name:</label> -->
            <br>
            <input type="text" placeholder="Enter Name">
            <br>
            <br>
            <!-- <label for="name" style="font-size: larger; background-color: white;">Password:</label> -->
            <br>
            <input type="password" placeholder="Enter Password">
            <br>
            <br>
            <button type="submit" class="login-btn">Login</button>
            <button type="reset" class="reset-btn">Reset</button>
            <br>
            <br>
            <label style="color: white;">
                <input type="checkbox" style="width: auto; height: auto;">
                Remember Me
            </label>
            <a href="ForgotPassword.html">Forgot Password</a>
            <br>
            <a href="register.html">Create Account</a>
        </form>
    </div>
</body>
</html>
